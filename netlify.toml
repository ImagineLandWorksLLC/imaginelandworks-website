[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "./netlify/plugins/indexnow"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://d3ey4dbjkt2f6s.cloudfront.net https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://d3ey4dbjkt2f6s.cloudfront.net https://unpkg.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://unpkg.com https://d3ey4dbjkt2f6s.cloudfront.net; font-src 'self' data:; connect-src 'self' https://clienthub.getjobber.com https://cloudflareinsights.com https://*.basemaps.cartocdn.com; frame-src https://clienthub.getjobber.com; base-uri 'self'; form-action 'self' https://clienthub.getjobber.com; object-src 'none'"
